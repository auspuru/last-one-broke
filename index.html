<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Gem Rush</title>
<style>
:root{--bg:#10152b;--panel:#1b2342;--cell:#273052;--text:#f7f8ff;--muted:#b7bfdf;--accent:#ffd45c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;background:radial-gradient(circle at top,#29376c,#10152b 62%);color:var(--text);font-family:Arial,sans-serif}
.app{width:min(100%,560px);padding:16px}h1{text-align:center;margin:4px 0 12px;font-size:28px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.stat{background:var(--panel);border-radius:14px;text-align:center;padding:9px}.label{font-size:12px;color:var(--muted)}.value{font-size:23px;font-weight:700;margin-top:2px}
.controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 12px}#message{font-size:14px;color:var(--muted);min-height:34px;display:flex;align-items:center}button{font:inherit}#restart{border:0;border-radius:12px;padding:10px 14px;background:var(--accent);color:#2d2500;font-weight:700;white-space:nowrap}
.board{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;padding:8px;background:#11182f;border:2px solid #34416f;border-radius:18px;touch-action:manipulation;user-select:none}.cell{aspect-ratio:1;border:1px solid #3d4974;border-radius:10px;background:var(--cell);padding:8%;cursor:pointer;transition:.14s}.cell:active{transform:scale(.9)}.cell.selected{outline:3px solid var(--accent);transform:scale(.91)}.cell.removing{opacity:0;transform:scale(.2) rotate(25deg)}
.gem{width:100%;height:100%;display:block;transform:rotate(45deg) scale(.72);border:2px solid rgba(255,255,255,.35);box-shadow:inset 3px 3px 0 rgba(255,255,255,.3)}.g0{background:#52d8ff;border-radius:25%}.g1{background:#ff5d79;border-radius:50%}.g2{background:#72e48c;border-radius:18%}.g3{background:#b983ff;border-radius:50% 20%}.g4{background:#ffc857;clip-path:polygon(50% 0,96% 34%,79% 100%,21% 100%,4% 34%)}.g5{background:#ff8e52;clip-path:polygon(50% 0,63% 35%,100% 50%,63% 65%,50% 100%,37% 65%,0 50%,37% 35%)}
.help{margin-top:12px;padding:11px 13px;background:rgba(255,255,255,.07);border-radius:12px;color:var(--muted);font-size:14px;line-height:1.4}.overlay{position:fixed;inset:0;background:rgba(8,11,25,.82);display:none;align-items:center;justify-content:center;padding:24px}.overlay.show{display:flex}.modal{width:min(100%,360px);background:var(--panel);border-radius:20px;padding:24px;text-align:center}.modal h2{margin-top:0}.modal button{border:0;border-radius:12px;padding:11px 18px;background:var(--accent);color:#2d2500;font-weight:700}
@media(max-width:400px){.app{padding:10px}.board{gap:3px;padding:5px}.cell{border-radius:7px}h1{font-size:24px}.value{font-size:20px}}
</style>
</head>
<body>
<main class="app">
<h1>💎 Gem Rush</h1>
<section class="stats"><div class="stat"><div class="label">SCORE</div><div id="score" class="value">0</div></div><div class="stat"><div class="label">TIME</div><div id="time" class="value">60</div></div><div class="stat"><div class="label">BEST COMBO</div><div id="combo" class="value">0</div></div></section>
<div class="controls"><div id="message" aria-live="polite">Tap two neighbouring gems to swap.</div><button id="restart" type="button">New Game</button></div>
<div id="board" class="board" aria-label="Gem game board"></div>
<div class="help">Match 3 or more identical gems. Cascading matches multiply your points.</div>
</main>
<div id="overlay" class="overlay"><div class="modal"><h2>Time’s up!</h2><p>Your final score is <strong id="finalScore">0</strong>.</p><button id="playAgain" type="button">Play Again</button></div></div>
<script>
const SIZE=8,TYPES=6,DURATION=60;
const boardEl=document.getElementById('board'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),comboEl=document.getElementById('combo'),messageEl=document.getElementById('message'),overlay=document.getElementById('overlay'),finalScore=document.getElementById('finalScore');
let board=[],selected=null,score=0,time=DURATION,bestCombo=0,busy=false,playing=true,timer;
const sleep=ms=>new Promise(r=>setTimeout(r,ms)),randomGem=()=>Math.floor(Math.random()*TYPES),posKey=(r,c)=>r+'-'+c;
function buildBoard(){board=Array.from({length:SIZE},()=>Array(SIZE).fill(0));for(let r=0;r<SIZE;r++){for(let c=0;c<SIZE;c++){let v;do{v=randomGem()}while((c>=2&&board[r][c-1]===v&&board[r][c-2]===v)||(r>=2&&board[r-1][c]===v&&board[r-2][c]===v));board[r][c]=v}}}
function render(){boardEl.innerHTML='';for(let r=0;r<SIZE;r++){for(let c=0;c<SIZE;c++){const cell=document.createElement('button');cell.type='button';cell.className='cell';cell.dataset.r=r;cell.dataset.c=c;cell.setAttribute('aria-label',`Gem row ${r+1}, column ${c+1}`);if(selected&&selected.r===r&&selected.c===c)cell.classList.add('selected');if(board[r][c]!==null){const gem=document.createElement('span');gem.className='gem g'+board[r][c];cell.appendChild(gem)}boardEl.appendChild(cell)}}}
function adjacent(a,b){return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1}function swap(a,b){[board[a.r][a.c],board[b.r][b.c]]=[board[b.r][b.c],board[a.r][a.c]]}
function findMatches(){const found=new Set();for(let r=0;r<SIZE;r++){let start=0;for(let c=1;c<=SIZE;c++){if(c<SIZE&&board[r][c]!==null&&board[r][c]===board[r][start])continue;if(board[r][start]!==null&&c-start>=3)for(let x=start;x<c;x++)found.add(posKey(r,x));start=c}}for(let c=0;c<SIZE;c++){let start=0;for(let r=1;r<=SIZE;r++){if(r<SIZE&&board[r][c]!==null&&board[r][c]===board[start][c])continue;if(start<SIZE&&board[start][c]!==null&&r-start>=3)for(let x=start;x<r;x++)found.add(posKey(x,c));start=r}}return found}
async function removeMatches(matches,chain){for(const p of matches){const [r,c]=p.split('-');const cell=boardEl.querySelector(`[data-r="${r}"][data-c="${c}"]`);if(cell)cell.classList.add('removing')}await sleep(180);for(const p of matches){const [r,c]=p.split('-').map(Number);board[r][c]=null}const gained=matches.size*10*chain;score+=gained;bestCombo=Math.max(bestCombo,chain);scoreEl.textContent=score;comboEl.textContent=bestCombo;messageEl.textContent=chain>1?`Combo x${chain}! +${gained}`:`Match! +${gained}`}
function collapse(){for(let c=0;c<SIZE;c++){const vals=[];for(let r=SIZE-1;r>=0;r--)if(board[r][c]!==null)vals.push(board[r][c]);for(let r=SIZE-1,i=0;r>=0;r--,i++)board[r][c]=i<vals.length?vals[i]:randomGem()}}
async function resolve(){let chain=1,matches=findMatches();while(matches.size&&playing){await removeMatches(matches,chain);collapse();render();await sleep(170);chain++;matches=findMatches()}}
async function choose(r,c){if(busy||!playing)return;const current={r,c};if(!selected){selected=current;render();messageEl.textContent='Choose a neighbouring gem.';return}if(selected.r===r&&selected.c===c){selected=null;render();messageEl.textContent='Selection cleared.';return}if(!adjacent(selected,current)){selected=current;render();messageEl.textContent='That gem is not beside the selected one.';return}busy=true;const first=selected;selected=null;swap(first,current);render();await sleep(140);if(findMatches().size===0){swap(first,current);render();messageEl.textContent='That swap creates no match.';await sleep(130)}else await resolve();busy=false}
function endGame(){playing=false;busy=true;clearInterval(timer);finalScore.textContent=score;overlay.classList.add('show')}
function startGame(){clearInterval(timer);score=0;time=DURATION;bestCombo=0;selected=null;busy=false;playing=true;scoreEl.textContent='0';timeEl.textContent=DURATION;comboEl.textContent='0';messageEl.textContent='Tap two neighbouring gems to swap.';overlay.classList.remove('show');buildBoard();render();timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)endGame()},1000)}
boardEl.addEventListener('click',e=>{const cell=e.target.closest('.cell');if(!cell)return;choose(Number(cell.dataset.r),Number(cell.dataset.c))});document.getElementById('restart').addEventListener('click',startGame);document.getElementById('playAgain').addEventListener('click',startGame);startGame();
</script>
</body>
</html>
