<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <meta name="theme-color" content="#08120f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Emerald Quest</title>
  <style>
    :root {
      color-scheme: dark;
      background: #08120f;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #08120f;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
    }

    #game {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      touch-action: none;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 10;
      color: #ffe59a;
      background: #08120f;
      font-weight: 700;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">OPENING EMERALD QUEST…</div>
  <main id="game" aria-label="Emerald Quest game"></main>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script type="module" src="./src/audio/SoundManager.js"></script>
  <script type="module" src="./src/main.js"></script>
  <script>
    window.addEventListener('load', () => {
      window.setTimeout(() => {
        const loading = document.getElementById('loading');
        if (loading) loading.remove();
      }, 250);
    });
  </script>
</body>
</html>
