<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >
  <meta name="theme-color" content="#06100c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Emerald Quest</title>
  <style>
    :root {
      color-scheme: dark;
      background: #06100c;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #06100c;
      font-family: "Trebuchet MS", Arial, sans-serif;
    }

    body {
      min-height: 100dvh;
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
      background: #06100c;
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      max-width: none !important;
      max-height: none !important;
      touch-action: none;
    }

    #loading,
    #rotate-device {
      position: fixed;
      inset: 0;
      z-index: 20;
      place-items: center;
      text-align: center;
      background: #06100c;
    }

    #loading {
      display: grid;
      color: #ffe59a;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    #rotate-device {
      display: none;
      padding: 32px;
      background:
        radial-gradient(circle at 50% 45%, rgba(45, 118, 84, 0.3), transparent 44%),
        #06100c;
    }

    #rotate-device .panel {
      width: min(360px, 92vw);
      padding: 28px 24px;
      color: #e9f2ed;
      border: 2px solid #a8752d;
      border-radius: 12px;
      background: #101f19;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
    }

    #rotate-device .icon {
      display: block;
      margin-bottom: 12px;
      color: #73edbd;
      font-size: 48px;
      line-height: 1;
    }

    #rotate-device strong {
      display: block;
      margin-bottom: 9px;
      color: #f4d487;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
    }

    #rotate-device p {
      margin: 0 0 18px;
      color: #bcd0c7;
      font-size: 14px;
      line-height: 1.45;
    }

    #play-portrait {
      min-height: 42px;
      padding: 10px 18px;
      color: #201304;
      border: 1px solid #ffe6a1;
      border-radius: 6px;
      background: #e3b54f;
      font: 700 13px "Trebuchet MS", Arial, sans-serif;
      cursor: pointer;
    }

    @media (orientation: portrait) and (max-width: 720px) {
      #rotate-device:not([hidden]) {
        display: grid;
      }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">OPENING EMERALD QUEST…</div>
  <div id="rotate-device" role="dialog" aria-label="Landscape orientation recommendation">
    <div class="panel">
      <span class="icon" aria-hidden="true">↻</span>
      <strong>Rotate for the full temple</strong>
      <p>Emerald Quest uses a widescreen chamber and edge-mounted mobile controls.</p>
      <button id="play-portrait" type="button">PLAY ANYWAY</button>
    </div>
  </div>
  <main id="game" aria-label="Emerald Quest game"></main>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script type="module" src="./src/compat/PhaserGraphicsCompat.js"></script>
  <script type="module" src="./src/audio/SoundManager.js"></script>
  <script type="module" src="./src/main.js"></script>
  <script type="module" src="./src/visual/ProductionPipeline.js"></script>
  <script type="module" src="./src/feel/GameFeel.js"></script>
  <script type="module" src="./src/visual/LandscapeSlice.js"></script>
  <script type="module" src="./src/visual/ContainerOrderFix.js"></script>
  <script type="module" src="./src/visual/TempleRebuild.js"></script>
  <script type="module" src="./src/visual/TempleExpansion.js"></script>
  <script>
    const rotatePrompt = document.getElementById('rotate-device');
    const playPortrait = document.getElementById('play-portrait');

    playPortrait?.addEventListener('click', () => {
      rotatePrompt?.setAttribute('hidden', '');
    });

    window.addEventListener('orientationchange', () => {
      if (window.matchMedia('(orientation: landscape)').matches) {
        rotatePrompt?.setAttribute('hidden', '');
      }
    });

    window.addEventListener('load', () => {
      window.setTimeout(() => {
        document.getElementById('loading')?.remove();
      }, 250);
    });
  </script>
</body>
</html>
