<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#13091f">
<title>Temple Quest</title>
<style>
:root{--ink:#fff6d8;--gold:#ffd25a;--deep:#0d0718;--panel:#25153b;--violet:#6d4b91;--stone:#5a4438}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{overscroll-behavior:none}body{margin:0;min-height:100vh;display:flex;justify-content:center;color:var(--ink);font-family:Trebuchet MS,Arial,sans-serif;background:radial-gradient(circle at 50% -8%,#714592 0,#29174b 36%,#0d0718 78%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.08;background-image:radial-gradient(circle at 20% 15%,#fff 0 1px,transparent 1px),radial-gradient(circle at 80% 35%,#fff 0 1px,transparent 1px);background-size:70px 70px,95px 95px}
.app{width:min(100%,570px);padding:calc(10px + env(safe-area-inset-top)) 10px calc(18px + env(safe-area-inset-bottom))}.hero{text-align:center;padding-bottom:8px}.eyebrow{font-size:10px;letter-spacing:3px;color:#f0cb68;font-weight:900}.hero h1{font-size:29px;margin:3px 0 1px;color:#fff4bf;text-shadow:0 3px #6b371f,0 0 18px #ffc95d55}.hero p{margin:0;color:#d6c8b0;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:8px}.stat{position:relative;overflow:hidden;background:linear-gradient(#49326f,#281846);border:2px solid #77589d;border-bottom-color:#412b5f;border-radius:14px;padding:7px;text-align:center;box-shadow:inset 0 1px #ffffff25,0 5px 12px #0005}.stat:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 20%,#ffffff12,transparent 75%)}.label{font-size:9px;letter-spacing:1.2px;color:#d8cae9}.value{font-size:20px;font-weight:900;color:#fff1a2;text-shadow:0 2px #6b3918}
.message{min-height:38px;background:linear-gradient(90deg,#1a0f2cdd,#2f1b4ddd);border:1px solid #684b87;border-radius:11px;padding:8px 10px;font-size:13px;display:flex;align-items:center;margin-bottom:8px;box-shadow:inset 0 1px #ffffff12}.frame{position:relative;padding:8px;border-radius:20px;background:linear-gradient(135deg,#7b4a25,#e8bc61 28%,#8e552b 55%,#f0d27b 78%,#6f3e20);box-shadow:0 12px 30px #0009,inset 0 0 0 2px #fff3a04d}.frame:before,.frame:after{content:"◆";position:absolute;top:50%;transform:translateY(-50%);color:#5e321b;text-shadow:0 1px #f2d282;font-size:13px}.frame:before{left:1px}.frame:after{right:1px}
.board{display:grid;grid-template-columns:repeat(10,1fr);background:#10091c;border:3px solid #3d241a;border-radius:13px;overflow:hidden;touch-action:none;box-shadow:inset 0 0 20px #000}.tile{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;overflow:hidden}.floor{background:linear-gradient(145deg,#39264e,#21152f 58%,#171022);border:1px solid #ffffff08}.floor:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 49%,#ffffff08 50%,transparent 51%),linear-gradient(transparent 49%,#0003 50%,transparent 51%);background-size:18px 18px;opacity:.42}.floor:after{content:"";position:absolute;width:3px;height:3px;border-radius:50%;background:#8e6ca8;box-shadow:12px 7px #5e4776,-9px 11px #4b385e;opacity:.4}
.wall{background:linear-gradient(135deg,#765640,#493426 52%,#302117);border:1px solid #24160f;box-shadow:inset 0 0 0 2px #8e6a4d,inset 0 -6px #2b1d15}.wall:before{content:"";position:absolute;inset:4px;border:1px solid #2d1e16;border-radius:3px;background:linear-gradient(135deg,#ffffff12,transparent 45%)}.wall:after{content:"";position:absolute;left:8%;right:8%;top:48%;height:1px;background:#2d1d15;box-shadow:0 -9px #2d1d15,0 9px #2d1d15}
.entity{position:relative;z-index:2}.explorer{width:72%;height:82%;filter:drop-shadow(0 4px 2px #0009);animation:bob .55s ease-in-out infinite alternate}.explorer .legs{position:absolute;left:27%;right:27%;bottom:2%;height:24%;background:linear-gradient(90deg,#2c2345 0 40%,transparent 40% 60%,#2c2345 60%);border-radius:3px}.explorer .body{position:absolute;left:20%;right:20%;top:34%;bottom:18%;background:linear-gradient(#d9a04c,#8b5526);border:2px solid #5f341d;border-radius:38% 38% 25% 25%;box-shadow:inset 4px 0 #f0c06d55}.explorer .head{position:absolute;left:30%;right:30%;top:18%;height:27%;background:#d59a65;border:2px solid #6b3a26;border-radius:45%;z-index:2}.explorer .hat{position:absolute;left:18%;right:18%;top:4%;height:27%;background:linear-gradient(#e8c170,#9a6428);border:2px solid #68421f;border-radius:55% 55% 20% 20%;z-index:3}.explorer .hat:after{content:"";position:absolute;left:-12%;right:-12%;bottom:-3px;height:5px;background:#7a4b24;border-radius:5px}.explorer .pack{position:absolute;left:8%;top:40%;width:26%;height:38%;background:#6d3f29;border:2px solid #3e2418;border-radius:5px}
.gem{width:58%;height:66%;clip-path:polygon(50% 0,92% 30%,73% 100%,27% 100%,8% 30%);background:linear-gradient(135deg,#d8ffff 0 12%,#42ddff 13% 35%,#1383d1 36% 58%,#67f0ff 59% 78%,#0c5aaa 79%);filter:drop-shadow(0 0 7px #4ee6ff) drop-shadow(0 4px 2px #0008);animation:shine 1.1s ease-in-out infinite alternate}.gem:after{content:"";position:absolute;left:24%;top:14%;width:18%;height:24%;background:#fff;border-radius:50%;opacity:.75;transform:rotate(25deg)}
.rock{width:72%;height:72%;border-radius:47% 53% 58% 42%;background:radial-gradient(circle at 32% 26%,#a6978f 0 12%,#776a64 13% 35%,#4e4541 36% 67%,#2f2927 68%);border:2px solid #241f1d;box-shadow:inset -5px -6px #211d1b88,inset 4px 3px #ffffff22,0 5px 3px #0008}.rock:before,.rock:after{content:"";position:absolute;border-radius:50%;background:#403936}.rock:before{width:15%;height:12%;left:22%;top:28%}.rock:after{width:22%;height:15%;right:17%;bottom:22%}
.door{width:68%;height:82%;border-radius:40% 40% 8% 8%;background:linear-gradient(90deg,#5f331c,#a4602d 18%,#6f3c1e 47%,#b46d32 75%,#4b2817);border:3px solid #2b1710;box-shadow:inset 0 0 0 3px #d19243aa,0 4px 3px #0008;position:relative}.door:before{content:"";position:absolute;inset:12% 15%;border:2px solid #3a1f14;border-radius:35% 35% 4px 4px}.door:after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;right:17%;top:52%;background:#f4d275;box-shadow:0 0 7px #ffd86a}.door.open{filter:drop-shadow(0 0 10px #ffd45c);animation:doorGlow 1s ease-in-out infinite alternate}.door.locked{filter:grayscale(.75) brightness(.58)}
@keyframes bob{to{transform:translateY(-2px)}}@keyframes shine{to{transform:translateY(-2px) scale(1.09);filter:drop-shadow(0 0 12px #8ff4ff) drop-shadow(0 4px 2px #0008)}}@keyframes doorGlow{to{filter:drop-shadow(0 0 17px #ffd45c)}}
.controls{display:grid;grid-template-columns:repeat(3,66px);grid-template-rows:repeat(2,55px);gap:8px;justify-content:center;margin:13px 0}.move{position:relative;border:2px solid #fff0a0;border-bottom-color:#8f5819;border-radius:16px;background:linear-gradient(#fff0a0,#e9ac32 60%,#c67b1e);color:#3d2200;font-size:24px;font-weight:900;box-shadow:0 5px 0 #7a4513,0 8px 13px #0005;touch-action:none}.move:active{transform:translateY(3px);box-shadow:0 2px 0 #7a4513}.up{grid-column:2}.left{grid-column:1;grid-row:2}.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}.actions{display:flex;gap:8px;justify-content:center}.secondary{border:1px solid #a588cc;border-radius:12px;background:linear-gradient(#3d285f,#291a43);color:white;padding:9px 15px;font-weight:800;box-shadow:0 4px 10px #0005}.help{text-align:center;color:#cfc3ad;font-size:12px;line-height:1.45;margin-top:9px}.overlay{position:fixed;inset:0;background:#080414e8;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.overlay.show{display:flex}.modal{width:min(100%,350px);background:linear-gradient(#483072,#22143e);border:3px solid #d7a94a;border-radius:20px;padding:23px;text-align:center;box-shadow:0 20px 50px #000}.modal h2{margin-top:0}.modal button{border:0;border-radius:12px;padding:11px 17px;background:linear-gradient(#ffe889,#dca127);font-weight:900;color:#3d2200}@media(max-width:390px){.hero h1{font-size:25px}.controls{grid-template-columns:repeat(3,60px)}.move{font-size:21px}}
</style>
</head>
<body>
<main class="app">
<header class="hero"><div class="eyebrow">THE SUNKEN TEMPLE</div><h1>Temple Quest</h1><p>Level 1 — recover the crystals and unlock the gate</p></header>
<section class="stats"><div class="stat"><div class="label">LEVEL</div><div class="value">1</div></div><div class="stat"><div class="label">CRYSTALS</div><div id="gems" class="value">0/0</div></div><div class="stat"><div class="label">MOVES</div><div id="moves" class="value">0</div></div></section>
<div id="message" class="message" aria-live="polite">Use the arrows or swipe across the temple.</div>
<div class="frame"><div id="board" class="board" aria-label="Temple adventure board"></div></div>
<div class="controls" aria-label="Movement controls"><button class="move up" data-dr="-1" data-dc="0">▲</button><button class="move left" data-dr="0" data-dc="-1">◀</button><button class="move down" data-dr="1" data-dc="0">▼</button><button class="move right" data-dr="0" data-dc="1">▶</button></div>
<div class="actions"><button id="restart" class="secondary">Restart level</button></div>
<div class="help">Collect every crystal, push movable rocks, and reach the glowing gate.</div>
</main>
<div id="overlay" class="overlay"><div class="modal"><h2>Chamber Cleared!</h2><p>You escaped in <strong id="finalMoves">0</strong> moves.</p><button id="again">Play Again</button></div></div>
<script>
const template=['##########','#P..#...G#','#.#.#.##.#','#.#...R..#','#.###.##.#','#G....#..#','###.#.#G.#','#...#....#','#.R....#E#','##########'];
const boardEl=document.getElementById('board'),gemsEl=document.getElementById('gems'),movesEl=document.getElementById('moves'),messageEl=document.getElementById('message'),overlay=document.getElementById('overlay');
let map,player,totalGems,collected,moves,busy=false,touchStart=null;
function explorerMarkup(){return '<div class="entity explorer"><span class="pack"></span><span class="legs"></span><span class="body"></span><span class="head"></span><span class="hat"></span></div>'}
function reset(){map=template.map(r=>r.split(''));totalGems=0;collected=0;moves=0;overlay.classList.remove('show');for(let r=0;r<map.length;r++)for(let c=0;c<map[r].length;c++){if(map[r][c]==='P'){player={r,c};map[r][c]='.'}if(map[r][c]==='G')totalGems++}messageEl.textContent='Use the arrows or swipe across the temple.';render()}
function render(){boardEl.innerHTML='';for(let r=0;r<map.length;r++)for(let c=0;c<map[r].length;c++){const tile=document.createElement('div'),v=map[r][c];tile.className='tile '+(v==='#'?'wall':'floor');if(player.r===r&&player.c===c)tile.innerHTML=explorerMarkup();else if(v==='G')tile.innerHTML='<div class="entity gem"></div>';else if(v==='R')tile.innerHTML='<div class="entity rock"></div>';else if(v==='E')tile.innerHTML='<div class="entity door '+(collected<totalGems?'locked':'open')+'"></div>';boardEl.appendChild(tile)}gemsEl.textContent=collected+'/'+totalGems;movesEl.textContent=moves}
function walk(dr,dc){if(busy)return;const nr=player.r+dr,nc=player.c+dc,target=map[nr]?.[nc];if(target===undefined||target==='#')return;if(target==='R'){const rr=nr+dr,rc=nc+dc;if(dr!==0||map[rr]?.[rc]!=='.'){messageEl.textContent='That stone cannot move there.';return}map[rr][rc]='R';map[nr][nc]='.'}if(target==='E'&&collected<totalGems){messageEl.textContent='The gate is sealed. Recover every crystal first.';return}player={r:nr,c:nc};moves++;if(target==='G'){map[nr][nc]='.';collected++;messageEl.textContent=collected===totalGems?'The ancient gate is now glowing!':'Crystal recovered!'}if(target==='E'&&collected===totalGems){render();document.getElementById('finalMoves').textContent=moves;overlay.classList.add('show');return}render()}
document.querySelectorAll('.move').forEach(b=>{const go=e=>{e.preventDefault();walk(+b.dataset.dr,+b.dataset.dc)};b.addEventListener('touchstart',go,{passive:false});b.addEventListener('click',e=>{if(!('ontouchstart'in window))go(e)})});
boardEl.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];touchStart={x:t.clientX,y:t.clientY}},{passive:false});boardEl.addEventListener('touchend',e=>{e.preventDefault();if(!touchStart)return;const t=e.changedTouches[0],dx=t.clientX-touchStart.x,dy=t.clientY-touchStart.y;touchStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;if(Math.abs(dx)>Math.abs(dy))walk(0,dx>0?1:-1);else walk(dy>0?1:-1,0)},{passive:false});
document.addEventListener('keydown',e=>{const k={ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];if(k){e.preventDefault();walk(...k)}});document.getElementById('restart').addEventListener('click',reset);document.getElementById('again').addEventListener('click',reset);reset();
</script>
</body>
</html>
